# song_config.example.yaml
#
# Copy this file to song_config.yaml in your song folder and fill in your values.
# song_config.yaml is gitignored because it contains local paths.
#
# Usage: bandleader ./my_song_folder

song:
  bpm: 120                          # Must match your Suno/Udio track BPM
  time_signature: 4/4
  progression: "Am G | F | C G"    # Bars separated by |, chords within a bar by spaces
  bars: 32                          # Total bars to generate for MIDI layers
  seed: 0                           # Integer seed for deterministic bass/arp output

# Partial filename keywords used to locate stems in your song folder.
# Bandleader will find the first file whose name contains this string (case-insensitive).
stems:
  drums: "drums"
  vocals: "vocals"
  synth: "synth"                    # Only needed if clean_synth is enabled
  overheads: "overheads"            # Optional: used by phase_align.pair_snare_overheads
  guitars: "guitars"                # Optional: used by phase_align.pair_bass_guitars

# Paths to .sf2 soundfonts used for MIDI rendering.
# Paths are relative to the song folder, or can be absolute.
soundfonts:
  drums: "/path/to/drums.sf2"       # e.g. Salamander Drumkit
  bass: "/path/to/bass.sf2"         # e.g. FluidR3_GM.sf2
  arp: "/path/to/arp.sf2"           # e.g. FluidR3_GM.sf2
  synth: "/path/to/synth.sf2"       # Only needed if clean_synth is enabled

# Enable or disable each pipeline step independently.
# Any step set to enabled: false is skipped entirely.
pipeline:

  # Re-synthesize drums from scratch via onset detection + FluidSynth
  clean_drums:
    enabled: true
    export_sidechain_trigger: false # true = export gen_sidechain_trigger.mid/.wav aligned to kick hits

  # Apply corrective EQ/compression to the vocal stem
  clean_vocals:
    enabled: true
    normalize: false               # true = apply loudness normalization via ffmpeg loudnorm
    target_lufs: -18.0             # integrated loudness target (LUFS)
    target_true_peak: -1.5         # true-peak ceiling (dBTP)
    target_lra: 11.0               # loudness range target (LU)

  # Generate a rule-based MIDI bassline and render to audio
  generate_bass:
    enabled: true
    style: "two_feel"               # two_feel | four_on_floor | eighths | disco
    sidechain_ducking: false        # true = render gen_bass_ducked.wav keyed from sidechain trigger/kick
    ducking_depth: 0.35             # 0.0-1.0, conservative default
    ducking_attack_ms: 10.0         # compressor attack in ms
    ducking_release_ms: 120.0       # compressor release in ms

  # Generate a rule-based MIDI arpeggio and render to audio
  generate_arp:
    enabled: false
    style: "eighths"                # eighths | sixteenths | pop_arp | alberti | broken | syncop | random_no_repeat
    motion: "updown"                # up | down | updown | random | random_no_repeat

  # Optional phase alignment pass for stem timing coherence
  phase_align:
    enabled: false
    max_shift_ms: 12.0              # max allowed shift in milliseconds
    min_confidence: 0.35            # 0.0-1.0 confidence gate for apply vs skip
    pair_kick_bass: true            # align generated bass against kick reference
    pair_snare_overheads: false     # align overheads stem against drum/snare proxy
    pair_bass_guitars: false        # align guitars stem against dry generated bass

  # Re-synthesize a monophonic synth/lead stem via pitch tracking + FluidSynth
  # Best for: single-note leads, simple basslines, arpeggiated single-note patterns
  # NOT for: chords, pads, or polyphonic parts
  clean_synth:
    enabled: false
